name: "议题与 PR 维护"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:
  lock-inactive:
    name: 锁定长期无响应议题
    runs-on: ubuntu-24.04
    steps:
      - uses: klaasnicolaas/action-inactivity-lock@v1.1.3
        id: lock
        with:
          days-inactive-issues: 14
          lock-reason-issues: ""
          days-inactive-prs: 36524
          lock-reason-prs: ""

  close-stale:
    name: 关闭长期无响应议题
    runs-on: ubuntu-24.04
    steps:
      - name: 关闭长期无响应议题
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          stale-issue-message: >
            这个议题因为长期没有新的反馈，已被自动标记为 stale。
            如果问题仍然存在，请补充当前版本、复现步骤或新的排查信息。
            如果 7 天内仍无更新，它会被自动关闭。

          close-issue-message: >
            这个议题因为长期没有新的反馈，已被自动关闭。
            如果问题仍然存在，请带上最新版本和复现信息重新提交。

          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: 36524

          operations-per-run: 1500

          stale-issue-label: "stale"
          remove-stale-when-updated: true
          any-of-labels: "awaiting-requester"
          exempt-issue-labels: "enhancement"

          exempt-assignees: true
          exempt-milestones: true
