name: Public readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "gitleaks_$env:GITLEAKS_VERSION`_linux_x64.tar.gz"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:GITLEAKS_LINUX_X64_SHA256) {
            throw "Gitleaks archive checksum mismatch."
          }
          tar -xzf $archive gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Audit repository tree and history
        shell: pwsh
        run: pwsh -NoProfile -File supplemental/scripts/audit-public-repository.ps1

      - name: Upload redacted audit evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-readiness-audit-${{ github.run_id }}
          path: .public-audit/
          if-no-files-found: ignore
          retention-days: 7
