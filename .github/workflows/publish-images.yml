name: Publish container images

# 2026-10-30 公开部署：把 Hub / Agent 镜像发到 GitHub Container Registry（ghcr.io），
# 其他人无需私有仓库即可 docker pull 直接部署。仅打标签时触发，使用仓库内置 GITHUB_TOKEN，
# 不需要任何自建密钥。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像标签（默认取 package.json 版本）"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  hub:
    name: Hub image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Prepare embedded Agent release dir
        run: mkdir -p build/releases/agent
      - name: Resolve version
        id: version
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: internal/dockerfile_hub
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HUB_VERSION=${{ steps.version.outputs.value }}
            HUB_BUILD_COMMIT=${{ github.sha }}
            HUB_BUILD_TIME=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository }}/pulse-hub:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}/pulse-hub:latest
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

  agent:
    name: Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Resolve version
        id: version
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: internal/dockerfile_agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AGENT_VERSION=${{ steps.version.outputs.value }}
            AGENT_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/pulse-agent:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}/pulse-agent:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
