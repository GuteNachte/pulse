name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/site/package-lock.json
      - name: Verify gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Verify Hub test process isolation
        shell: pwsh
        run: pwsh -NoProfile -File supplemental/scripts/test-run-go-test-shard.ps1
      - name: Verify release image lookup fallback
        shell: pwsh
        run: pwsh -NoProfile -File supplemental/scripts/test-release-image-reference.ps1
      - name: Install web dependencies
        run: npm ci --prefix internal/site
      - name: Build web app for Hub embed
        run: npm --prefix internal/site run build
      - name: Run go vet
        run: go vet -tags=testing ./...
      - name: Run non-Hub Go tests
        shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne "gutenacht.site/pulse/internal/hub" })
          if ($LASTEXITCODE -ne 0 -or $packages.Count -eq 0) {
            throw "Unable to resolve non-Hub Go packages."
          }
          & go test -tags=testing -count=1 -timeout=600s @packages
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  hub-tests:
    name: Hub tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/site/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix internal/site
      - name: Build web app for Hub embed
        run: npm --prefix internal/site run build
      - name: Run Hub Go test shard
        shell: pwsh
        run: >-
          pwsh -NoProfile -File supplemental/scripts/run-go-test-shard.ps1
          -ShardIndex ${{ matrix.shard }} -ShardCount 4 -Timeout 600s

  web:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Biome check
        run: npm run check
      - name: Run TypeScript check
        run: npm run typecheck
      - name: Run web regression tests
        run: npm run test
      - name: Build web app
        run: npm run build

  android-signing:
    name: Android signing contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/site/package-lock.json
      - name: Install Android web dependencies
        run: npm ci --prefix internal/site
      - name: Run secret-free Android signing contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File supplemental/scripts/test-android-signing-helpers.ps1
          pwsh -NoProfile -File supplemental/scripts/test-initialize-android-release-signing.ps1
          pwsh -NoProfile -File supplemental/scripts/test-build-android-release.ps1
      - name: Run Android Debug unit build
        run: |
          npm --prefix internal/site run android:sync
          internal/site/android/gradlew -p internal/site/android testDebugUnitTest --console=plain
