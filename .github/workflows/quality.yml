name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: true
      - name: Verify gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run go vet
        run: go vet -tags=testing ./...
      - name: Run Go tests
        run: go test -tags=testing -count=1 -timeout=300s ./...

  web:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Biome check
        run: npm run check
      - name: Run web regression tests
        run: npm run test
      - name: Build web app
        run: npm run build
