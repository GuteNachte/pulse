name: Public prerelease

on:
  push:
    tags:
      - "v*.*.*-*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation and environment approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      hub_image: ${{ steps.release.outputs.hub_image }}
      agent_image: ${{ steps.release.outputs.agent_image }}
      publish_requested: ${{ steps.release.outputs.publish_requested }}
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and guard release identity
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Raw internal/site/package.json | ConvertFrom-Json).version
          . ./supplemental/scripts/release-script-helpers.ps1
          $resolvedVersion = Resolve-PulseVersion -Version $version
          $tag = "v$version"
          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $publishRequested = "${{ github.event_name }}" -eq "push" -or "${{ inputs.publish }}" -eq "true"
          if ($publishRequested -and ("${{ github.ref_type }}" -ne "tag" -or "${{ github.ref_name }}" -ne $tag)) {
            throw "Publishing requires the exact tag $tag."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "hub_image=ghcr.io/$owner/pulse-hub:$version" >> $env:GITHUB_OUTPUT
          "agent_image=ghcr.io/$owner/pulse-agent:$version" >> $env:GITHUB_OUTPUT
          "publish_requested=$($publishRequested.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Require ready audit report
        shell: pwsh
        run: |
          $report = Get-Content -Raw docs/public-readiness-report.md
          if ($report -notmatch '(?m)^Status: ready\s*$') {
            throw "docs/public-readiness-report.md must contain Status: ready."
          }

      - name: Install verified Gitleaks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "gitleaks_$env:GITLEAKS_VERSION`_linux_x64.tar.gz"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:GITLEAKS_LINUX_X64_SHA256) { throw "Gitleaks archive checksum mismatch." }
          tar -xzf $archive gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/site/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install web dependencies
        run: npm ci --prefix internal/site

      - name: Build web app for Hub embed
        run: npm --prefix internal/site run build

      - name: Run repository and release contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File supplemental/scripts/audit-public-repository.ps1
          pwsh -NoProfile -File supplemental/scripts/check-version-consistency.ps1 -Version "${{ steps.release.outputs.version }}"
          pwsh -NoProfile -File supplemental/scripts/test-prerelease-version.ps1
          pwsh -NoProfile -File supplemental/scripts/test-set-pulse-version.ps1
          pwsh -NoProfile -File supplemental/scripts/test-android-signing-helpers.ps1
          pwsh -NoProfile -File supplemental/scripts/test-initialize-android-release-signing.ps1
          pwsh -NoProfile -File supplemental/scripts/test-build-android-release.ps1
          pwsh -NoProfile -File supplemental/scripts/test-package-public-release.ps1
          pwsh -NoProfile -File supplemental/scripts/test-release-image-reference.ps1
          pwsh -NoProfile -File supplemental/scripts/test-public-release-workflow.ps1

      - name: Run Go format and vet checks
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
          go vet -tags=testing ./...

      - name: Run non-Hub Go tests
        shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne "gutenacht.site/pulse/internal/hub" })
          if ($LASTEXITCODE -ne 0 -or $packages.Count -eq 0) {
            throw "Unable to resolve non-Hub Go packages."
          }
          & go test -tags=testing -count=1 -timeout=600s @packages
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Hub Go test shards
        shell: bash
        run: |
          pids=()
          for shard in 0 1 2 3; do
            pwsh -NoProfile -File supplemental/scripts/run-go-test-shard.ps1 \
              -ShardIndex "$shard" -ShardCount 4 -Timeout 600s &
            pids+=("$!")
          done

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit "$status"

      - name: Run web quality
        run: |
          npm --prefix internal/site run check -- --max-diagnostics=200
          npm --prefix internal/site run typecheck
          npm --prefix internal/site run test

      - name: Build Windows Agent
        shell: pwsh
        run: |
          pwsh -NoProfile -File supplemental/scripts/build-agent-v1.ps1 -Version "${{ steps.release.outputs.version }}" -OS windows -Arch amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File supplemental/scripts/publish-agent-v1.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -LinuxImage "${{ steps.release.outputs.agent_image }}" `
            -DryRun `
            -SkipLinuxImageBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Android secret-free compile checks
        shell: bash
        run: |
          npm --prefix internal/site run android:sync
          internal/site/android/gradlew -p internal/site/android testDebugUnitTest --console=plain

      - name: Require clean tracked tree
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"

  publish:
    name: Publish GHCR images and prerelease
    needs: validate
    if: needs.validate.outputs.publish_requested == 'true' && vars.PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: public-release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out validated tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/site/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install web dependencies
        run: npm ci --prefix internal/site

      - name: Restore Agent files required by the Hub image
        shell: pwsh
        run: |
          pwsh -NoProfile -File supplemental/scripts/build-agent-v1.ps1 -Version "${{ needs.validate.outputs.version }}" -OS windows -Arch amd64
          pwsh -NoProfile -File supplemental/scripts/publish-agent-v1.ps1 `
            -Version "${{ needs.validate.outputs.version }}" `
            -LinuxImage "${{ needs.validate.outputs.agent_image }}" `
            -DryRun `
            -SkipLinuxImageBuild

      - name: Materialize protected Android signing inputs
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Android signing secret is missing: $name"
            }
          }
          $signingRoot = Join-Path $env:RUNNER_TEMP "pulse-android-signing"
          New-Item -ItemType Directory -Path $signingRoot -Force | Out-Null
          $keyStorePath = Join-Path $signingRoot "pulse-android-release.p12"
          $propertiesPath = Join-Path $signingRoot "signing.properties"
          try {
            $keyBytes = [Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64)
          } catch {
            throw "ANDROID_RELEASE_KEYSTORE_BASE64 is not valid Base64."
          }
          [System.IO.File]::WriteAllBytes($keyStorePath, $keyBytes)
          $propertyLines = @(
            "storeFile=$($keyStorePath.Replace('\', '/'))",
            "storePassword=$env:ANDROID_RELEASE_STORE_PASSWORD",
            "keyAlias=$env:ANDROID_RELEASE_KEY_ALIAS",
            "keyPassword=$env:ANDROID_RELEASE_KEY_PASSWORD"
          )
          [System.IO.File]::WriteAllLines($propertiesPath, $propertyLines, [System.Text.UTF8Encoding]::new($false))
          chmod 600 $keyStorePath $propertiesPath
          "PULSE_ANDROID_SIGNING_PROPERTIES=$propertiesPath" >> $env:GITHUB_ENV

      - name: Build and verify signed Android Release APK
        shell: pwsh
        run: |
          pwsh -NoProfile -File supplemental/scripts/build-android-release.ps1 `
            -Version "${{ needs.validate.outputs.version }}" `
            -SigningPropertiesPath "$env:PULSE_ANDROID_SIGNING_PROPERTIES"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify public release
        shell: pwsh
        run: |
          pwsh -NoProfile -File supplemental/scripts/package-public-release.ps1 `
            -Version "${{ needs.validate.outputs.version }}" `
            -HubImage "${{ needs.validate.outputs.hub_image }}" `
            -AgentImage "${{ needs.validate.outputs.agent_image }}" `
            -OutputDirectory "build/public-release/${{ needs.validate.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File supplemental/scripts/verify-release-v1.ps1 `
            -Version "${{ needs.validate.outputs.version }}" `
            -SkipRegistry `
            -PublicReleaseDirectory "build/public-release/${{ needs.validate.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "build/public-release/${{ needs.validate.outputs.version }}/SHA256SUMS"

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push versioned images
        shell: bash
        run: |
          docker buildx build --platform linux/amd64 --push --provenance=false \
            -f internal/dockerfile_hub \
            --build-arg "HUB_VERSION=${{ needs.validate.outputs.version }}" \
            --build-arg "HUB_BUILD_COMMIT=${{ github.sha }}" \
            -t "${{ needs.validate.outputs.hub_image }}" .
          docker buildx build --platform linux/amd64 --push --provenance=false \
            -f internal/dockerfile_agent \
            --build-arg "AGENT_VERSION=${{ needs.validate.outputs.version }}" \
            -t "${{ needs.validate.outputs.agent_image }}" .

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ needs.validate.outputs.tag }}" \
            build/public-release/${{ needs.validate.outputs.version }}/* \
            --verify-tag \
            --title "Pulse ${{ needs.validate.outputs.version }}" \
            --generate-notes \
            --prerelease

      - name: Remove temporary Android signing inputs
        if: always()
        shell: pwsh
        run: |
          $signingRoot = Join-Path $env:RUNNER_TEMP "pulse-android-signing"
          if (Test-Path -LiteralPath $signingRoot) {
            Remove-Item -LiteralPath $signingRoot -Recurse -Force
          }
