name: 缺陷报告
description: 报告 Pulse 的缺陷或异常。
title: "[缺陷]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      description: |
        请尽量提供可复现的信息，包括版本、部署方式、系统环境、操作步骤和相关日志。
        提交前必须删除 Token、密码、Cookie、真实域名、IP、MAC、账号、家庭资产名称和其他私人信息。
      options:
        - label: 我已经确认正在使用当前维护版本。
          required: true
        - label: 我已经搜索过现有问题，没有找到相同报告。
          required: true
        - label: 这是可复现的缺陷，不是单纯的使用咨询。
          required: true
        - label: 我已经对日志、截图和配置完成脱敏，没有提交 Token、域名、IP、MAC 或家庭资产名称。
          required: true

  - type: dropdown
    id: component
    attributes:
      label: 模块
      description: 这个问题主要发生在哪一部分？
      options:
        - Hub
        - Agent
        - Hub & Agent
        - Web UI
        - Android App
        - 公开演示
        - 部署
      default: 0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明你看到的问题、触发条件、影响范围，以及是否稳定复现。
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 请描述你认为正确的表现。
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 复现步骤
      description: 请提供可以跟着操作的步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: 系统 / 架构
      placeholder: linux/amd64 (agent), windows/amd64 (hub)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Pulse 版本
      placeholder: 1.0.5
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 安装方式
      options:
        - Docker
        - 二进制
        - 飞牛 / NAS
        - 其他
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 配置
      description: 请只提供相关且已脱敏的 Compose、环境变量或服务配置，不要粘贴任何密钥或真实家庭网络信息。
      render: yaml

  - type: textarea
    id: hub-logs
    attributes:
      label: Hub 日志
      description: 请提供已经删除 Token、域名、IP、MAC、账号和家庭资产名称的 Hub 日志。
      render: json

  - type: textarea
    id: agent-logs
    attributes:
      label: Agent 日志
      description: 如问题涉及 Agent，请提供已经脱敏的 Agent 日志。
      render: shell
