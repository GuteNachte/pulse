<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="UTF-8" />
		<link rel="manifest" href="%BASE_URL%static/manifest.json" crossorigin="use-credentials" />
		<link rel="icon" type="image/svg+xml" href="%BASE_URL%static/icon.svg?v=1.0.6-beta.6" />
		<link rel="apple-touch-icon" href="%BASE_URL%static/icon.png?v=1.0.6-beta.6" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Pulse</title>
		<style>
			.dark { background: hsl(24 5% 8%); color-scheme: dark; }
		</style>
		<script>
			(() => {
				try {
					const theme = localStorage.getItem("ui-theme");
					const isDark =
						theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.add(isDark ? "dark" : "light");
				} catch {}
			})();
		</script>
		<script>
			globalThis.PULSE = "{info}"
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
