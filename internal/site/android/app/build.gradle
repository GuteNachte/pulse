apply plugin: 'com.android.application'

def pulseSigningPropertiesPath = providers.gradleProperty('pulseSigningPropertiesFile').orNull
def pulseSigningProperties = new Properties()
if (pulseSigningPropertiesPath != null) {
    def pulseSigningPropertiesFile = file(pulseSigningPropertiesPath)
    if (!pulseSigningPropertiesFile.isFile()) {
        throw new GradleException("Android Release signing properties do not exist: ${pulseSigningPropertiesFile}")
    }
    pulseSigningPropertiesFile.withInputStream { pulseSigningProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!pulseSigningProperties[key]) {
            throw new GradleException("Android Release signing properties are missing: ${key}")
        }
    }
    if (!file(pulseSigningProperties['storeFile']).isFile()) {
        throw new GradleException('Android Release keystore does not exist.')
    }
}

android {
    namespace = "site.gutenacht.pulse"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "site.gutenacht.pulse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('pulseVersionCode') ? project.property('pulseVersionCode').toInteger() : file('../version-code.txt').text.trim().toInteger()
        versionName project.hasProperty('pulseVersionName') ? project.property('pulseVersionName') : "1.0.6-beta.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (pulseSigningPropertiesPath != null) {
                storeFile file(pulseSigningProperties['storeFile'])
                storePassword pulseSigningProperties['storePassword']
                keyAlias pulseSigningProperties['keyAlias']
                keyPassword pulseSigningProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (pulseSigningPropertiesPath != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestsRelease = graph.allTasks.any { task -> task.name.toLowerCase().contains('release') }
    if (requestsRelease && pulseSigningPropertiesPath == null) {
        throw new GradleException('Release builds require -PpulseSigningPropertiesFile outside the repository.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
